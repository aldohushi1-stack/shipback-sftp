name: Bug report
description: Something went wrong with a deploy, pull, restore or the MCP server
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove host names, usernames and paths you'd rather not share.
        **Security problems** go through the Security tab instead, not a public issue (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what happened instead.
      placeholder: |
        I ran `shipback mysite --restore` after a deploy and it said …
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How were you running it?
      options:
        - CLI (shipback)
        - MCP server (shipback-mcp) from an AI client
        - Drop-box queue
        - Local app (npm start)
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client, if MCP
      placeholder: Claude Code, Cursor, Claude Desktop …
  - type: dropdown
    id: host
    attributes:
      label: Hosting
      options:
        - cPanel
        - Plesk
        - DirectAdmin
        - Plain VPS / Linux server
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Shipback version, Node version and your OS.
      placeholder: shipback-sftp 0.1.0, Node 22.14, Windows 11
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output with --json
      description: Run the same command again with `--json` and paste the output (or the MCP tool's error).
      render: json
